name: Build APK
on:
  push:
    paths: ['**.zip']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - name: Unzip and build
        run: |
          Z=$(git log -1 --diff-filter=AM --name-only --pretty=format: -- '*.zip' | head -n1)
          [ -n "$Z" ] || { echo "ZIP не найден в последнем коммите"; exit 1; }
          mkdir work
          unzip -q -o "$Z" -d work -x '__MACOSX/*'
          S=$(find work -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n1)
          [ -n "$S" ] || { echo "В ZIP нет settings.gradle(.kts)"; exit 1; }
          cd "$(dirname "$S")"
          ARGS="assembleDebug --parallel --build-cache --console=plain -Pandroid.injected.build.abi=arm64-v8a"
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew $ARGS; else gradle $ARGS; fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: work/**/build/outputs/apk/debug/*.apk
          compression-level: 0
          if-no-files-found: error
