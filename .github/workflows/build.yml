name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Unzip project
        id: find
        run: |
          ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n1)
          [ -n "$ZIP" ] || { echo "No .zip in repo"; exit 1; }
          echo "Using $ZIP"
          mkdir -p work
          unzip -q -o "$ZIP" -d work -x '__MACOSX/*'
          S=$(find work -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n1)
          [ -n "$S" ] || { echo "settings.gradle(.kts) not found in zip"; exit 1; }
          echo "dir=$(dirname "$S")" >> "$GITHUB_OUTPUT"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --parallel --build-cache --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Error summary
        if: failure()
        run: |
          { echo '## Build errors'; echo '```'; grep -nE "^e: |What went wrong|Execution failed|Could not|FAILED" build.log | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: build-log, path: build.log }
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: work/**/build/outputs/apk/debug/*.apk
          compression-level: 0
          if-no-files-found: error
