name: Build
run-name: build ${{ inputs.job }}
on:
  workflow_dispatch:
    inputs:
      job:
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false
    steps:
      # Тянем только нужный ZIP, а не весь репозиторий
      - uses: actions/checkout@v4
        with:
          sparse-checkout: jobs/${{ inputs.job }}.zip
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      # JDK 17 уже установлен на раннере — экономим время на setup-java
      - name: Use preinstalled JDK 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      # Кэш зависимостей Gradle между сборками
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - name: Tune Gradle
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.workers.max=4
          org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g
          kotlin.compiler.execution.strategy=in-process
          kotlin.incremental=false
          android.enableR8.fullMode=false
          PROPS
      - name: Stable signing key
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
      - name: Unzip and build
        run: |
          mkdir work
          unzip -q -o jobs/${{ inputs.job }}.zip -d work -x '__MACOSX/*'
          S=$(find work -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n1)
          [ -n "$S" ] || { echo "В ZIP нет settings.gradle(.kts)"; exit 1; }
          cd "$(dirname "$S")"
          # arm64-v8a — архитектура Nothing Phone (1): без лишних ABI сборка и APK меньше
          ARGS="assembleDebug --parallel --build-cache --console=plain -Pandroid.injected.build.abi=arm64-v8a"
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew $ARGS; else gradle $ARGS; fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.job }}
          path: work/**/build/outputs/apk/debug/*.apk
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
